<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFA meals • Instant Quote & Order</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --primary-soft: #fff7ed;
      --primary-border: #fed7aa;
      --green: #16a34a;
      --green-soft: #f0fdf4;
      --green-border: #bbf7d0;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --red-border: #fecaca;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --amber-text: #92400e;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;
      --radius: 16px;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
    }
    .brand-title { font-weight: 800; font-size: 16px; color: var(--text); line-height: 1.2; }
    .brand-sub { font-size: 11.5px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .status-pill.open { background: var(--green-soft); color: #15803d; border: 1px solid var(--green-border); }
    .status-pill.closed { background: var(--red-soft); color: #b91c1c; border: 1px solid var(--red-border); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .nav-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
      flex-shrink: 0;
    }
    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      padding: 7px 13px;
      border-radius: 9px;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
    }

    .container { max-width: 1040px; margin: 0 auto; padding: 18px 16px 48px; }

    /* Intro Card */
    .intro-card {
      background: linear-gradient(135deg, #fff7ed 0%, #ffffff 100%);
      border: 1.5px solid var(--primary-border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
